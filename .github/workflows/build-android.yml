name: build-android

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
        description: 'App name'
      pkg:
        required: true
        type: string
        description: 'Package name'
      version:
        required: true
        type: string
        description: 'Version to build'

jobs:
  build-android-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.ORG_TOKEN }}
          ref: f2d076e60d7b507ec2c097942adc4a6cf57004c5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            ${{ env.FLUTTER_HOME }}/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set build environment
        id: build-env
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          test "$(sed -n 's/^version: *//p' pubspec.yaml)" = "$VERSION"
          echo "build_number=${VERSION##*+}" >> "$GITHUB_OUTPUT"

      - name: Install Flutter dependencies
        run: |
          flutter pub get

      - name: Check Flutter version
        run: |
          flutter --version

      - name: Setup Android signing
        run: |
          echo "${{ secrets.PKCS12_BASE64 }}" | base64 -d > android/app/${{ secrets.PKCS12_NAME }}-keystore.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.PKCS12_PASSWORD }}
          keyPassword=${{ secrets.PKCS12_PASSWORD }}
          keyAlias=${{ secrets.PKCS12_NAME }}
          storeFile=${{ secrets.PKCS12_NAME }}-keystore.jks
          EOF

      - name: Build Android App Bundle and APK
        run: |
          set -xeuo pipefail
          echo "Building ${{ inputs.name }} ${{ inputs.version }} (Release Mode)"
          rm -rf .dart_tool android/.gradle
          flutter gen-l10n
          flutter pub run flutter_launcher_icons

          flutter build appbundle --release \
              --obfuscate \
              --split-debug-info=debug-info/android \
              --suppress-analytics \
              --no-tree-shake-icons
          mv build/app/outputs/bundle/release/app-release.aab \
             "${{ inputs.name }}-android-${{ inputs.version }}.aab"

          flutter build apk --release \
              --obfuscate \
              --split-debug-info=debug-info/android \
              --suppress-analytics \
              --no-tree-shake-icons
          mv build/app/outputs/flutter-apk/app-release.apk \
             "${{ inputs.name }}-android-universal-${{ inputs.version }}.apk"

      - name: Verify signed Android package and artwork
        run: |
          set -euo pipefail
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APK="${{ inputs.name }}-android-universal-${{ inputs.version }}.apk"
          "$TOOLS/apksigner" verify "$APK"
          "$TOOLS/aapt" dump badging "$APK" | sed -n '1p' > "$RUNNER_TEMP/android-package.txt"
          python3 - "$APK" "$RUNNER_TEMP/android-package.txt" <<'PY'
          import hashlib, pathlib, sys, zipfile
          badging = pathlib.Path(sys.argv[2]).read_text()
          assert "versionName='1.8.19'" in badging, badging
          assert "versionCode='204'" in badging, badging
          with zipfile.ZipFile(sys.argv[1]) as package:
              for name, expected in {'loading-scene.webp': '36c3569d6001671058decad5ba6372a5c02a9d6509be6497800bb584794a2641', 'loading-portrait.webp': '852f721e67e2fcd3fd4214731a49bda212dd1fbc443542b81525a730c6a0d403', 'brand-scene.png': '279b5864e47a8843e5d170dbe2f51bcd339bfb7493582fe1b3e4f70010a4d020', 'openbridge/bridge_open.webp': '70c90798f73224b2cf49331b459ec88da02f1edf32982ec0f8092bfaa7683c16', 'openbridge/bridge_connected.webp': 'b4e98a351a8d8d328b5ba14e191e8e1ecec72bbf4670fa10495891fdb45083cd'}.items():
                  actual = hashlib.sha256(package.read('assets/flutter_assets/assets/' + name)).hexdigest()
                  assert actual == expected, name
                  print(f'Verified {name} SHA-256: {actual}')
          print('Verified Android 1.8.19 (204), signature and artwork')
          PY

      - name: Decode Google Play service account
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}" | base64 -d > service-account.json

      - name: Upload to Google Play Store
        id: publish
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: ${{ inputs.pkg }}
          releaseFiles: ${{ inputs.name }}-android-${{ inputs.version }}.aab
          # Internal testing, not production: these apps have never been through
          # Play review, and a production+completed upload would publish them to
          # everyone the moment it passed. Internal needs no store listing and
          # installs straight onto allow-listed testers' devices.
          track: internal
          status: completed

      - name: Upload APK to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          files: ${{ inputs.name }}-android-universal-${{ inputs.version }}.apk


      # [2026-09-07] Mirror the artifact into the fjolsky-downloads R2 bucket so
      # dl.<brand>/android serves it from our own account (the Worker falls back
      # to this GitHub release only while R2 has no manifest). Additive:
      # continue-on-error, never blocks the release. Secrets: CLOUDFLARE_ACCOUNT_ID,
      # CLOUDFLARE_R2_TOKEN (R2-only token), R2_BUCKET. The app slug is the part of
      # PRIVATE_REPO after the slash (NOT inputs.name, which is vpn00000 for
      # 00000vpn). Keeps the two newest tags per app plus anything a latest/*.json
      # still points at, so the bucket stays inside the R2 free tier. A re-run of an
      # OLD release uploads its object but never repoints dl.* backwards.
      # Source of truth: XTPU/cloudflare/ci-r2-upload-step.yml.
      - name: Publish to R2 (dl.<brand> direct downloads)
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_R2_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ inputs.version }}
          PLATFORM: android
          FILE: ${{ inputs.name }}-android-universal-${{ inputs.version }}.apk
          KEEP_TAGS: "2"
        run: |
          set -euo pipefail
          APP="${PRIVATE_REPO:-}"; APP=$(printf %s "${APP#*/}" | tr 'A-Z' 'a-z')
          if [ -z "${CF_R2_TOKEN:-}" ] || [ -z "${CF_ACCOUNT:-}" ] || [ -z "${R2_BUCKET:-}" ] || [ -z "$APP" ] || [ -z "${FILE:-}" ]; then echo "R2 not configured or no file; skipping."; exit 0; fi
          FILE="${FILE//\\//}"
          [ -f "$FILE" ] || { echo "artifact not found: $FILE"; exit 0; }
          PY=$(command -v python3 || command -v python)
          case "$PLATFORM" in
            android) CT=application/vnd.android.package-archive;;
            windows) CT=application/zip;;
            macos)   CT=application/x-apple-diskimage;;
            *) echo "unknown PLATFORM=$PLATFORM"; exit 0;;
          esac
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$R2_BUCKET"
          AUTH="Authorization: Bearer $CF_R2_TOKEN"
          enc() { "$PY" -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe="/"))' "$1" | tr -d '\r'; }
          NAME=$(basename "$FILE"); KEY="$APP/$TAG/$NAME"
          SIZE=$(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE")
          SHA=$( (sha256sum "$FILE" 2>/dev/null || shasum -a 256 "$FILE") | cut -d' ' -f1)
          # 1) the bytes
          curl -fsS -m 1200 -X PUT "$API/objects/$(enc "$KEY")" -H "$AUTH" -H "Content-Type: $CT" --upload-file "$FILE" >/dev/null
          echo "R2: uploaded $KEY ($((SIZE/1048576)) MB)"
          # 2) the manifest -- unless the one already there points at a NEWER tag
          curl -fsS -m 120 "$API/objects/$(enc "$APP/latest/$PLATFORM.json")" -H "$AUTH" -o r2-current.json 2>/dev/null || echo '{}' > r2-current.json
          if "$PY" - "$TAG" <<'PYEOF'
          import json,re,sys
          def v(t):
              m=re.match(r"v?(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?$",t or ""); return tuple(int(x or 0) for x in m.groups()) if m else None
          try: cur=json.load(open("r2-current.json")).get("tag")
          except Exception: cur=None
          new=sys.argv[1]
          sys.exit(1 if (v(cur) and v(new) and v(cur)>v(new)) else 0)
          PYEOF
          then
            printf '{"tag":"%s","key":"%s","size":%s,"sha256":"%s","content_type":"%s","published_at":"%s","source":"github-actions %s"}\n' \
              "$TAG" "$KEY" "$SIZE" "$SHA" "$CT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" > r2-manifest.json
            curl -fsS -m 120 -X PUT "$API/objects/$(enc "$APP/latest/$PLATFORM.json")" -H "$AUTH" -H "Content-Type: application/json" --upload-file r2-manifest.json >/dev/null
            echo "R2: $APP/latest/$PLATFORM.json -> $TAG"
          else
            echo "R2: NOT repointing $APP/latest/$PLATFORM.json (it points at a newer tag than $TAG); object uploaded only"
          fi
          # 3) prune: keep the KEEP_TAGS newest tags (by last_modified) plus every tag a latest/*.json references
          curl -fsS -m 120 "$API/objects?prefix=$(enc "$APP/")&per_page=1000" -H "$AUTH" > r2-listing.json
          for p in android windows macos; do curl -fsS -m 120 "$API/objects/$(enc "$APP/latest/$p.json")" -H "$AUTH" -o "r2-ref-$p.json" 2>/dev/null || echo '{}' > "r2-ref-$p.json"; done
          "$PY" - "$APP" "$TAG" "$KEEP_TAGS" > r2-prune.txt <<'PYEOF'
          import json,sys,collections
          app,newtag,keep=sys.argv[1],sys.argv[2],int(sys.argv[3])
          objs=json.load(open("r2-listing.json")).get("result",[])
          protected={newtag}
          for p in ("android","windows","macos"):
              try: t=json.load(open("r2-ref-%s.json"%p)).get("tag")
              except Exception: t=None
              if t: protected.add(t)
          bytag=collections.defaultdict(list); newest={}
          for o in objs:
              parts=o["key"].split("/")
              if len(parts)<3 or parts[1]=="latest": continue
              ts=o.get("last_modified") or o.get("uploaded") or ""
              bytag[parts[1]].append(o["key"]); newest[parts[1]]=max(newest.get(parts[1],""),ts)
          order=sorted(bytag,key=lambda t:(t in protected,newest[t]),reverse=True)
          for t in order[keep:]:
              if t in protected: continue
              for k in bytag[t]: print(k)
          PYEOF
          while read -r k; do k="${k%$'\r'}"; [ -z "$k" ] && continue; curl -fsS -m 120 -X DELETE "$API/objects/$(enc "$k")" -H "$AUTH" >/dev/null && echo "pruned $k" || echo "prune skipped $k"; done < r2-prune.txt

      - name: Upload AAB to GitHub release (Play Store upload failed)
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          files: ${{ inputs.name }}-android-${{ inputs.version }}.aab
